name: go-async-jobs-v2
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build: .
    command: ["api"]
    environment:
      REDIS_ADDR: redis:6379
      HTTP_ADDR: :8080
      ADMIN_TOKEN: "${ADMIN_TOKEN:-local-dev-token}"
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
  worker:
    stop_grace_period: 350s
    build: .
    command: ["worker"]
    environment:
      REDIS_ADDR: redis:6379
      WORKER_CONCURRENCY: "5"
      WORKER_HEALTH_ADDR: ":8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
  scheduler:
    profiles: ["scheduler"]
    build: .
    command: ["scheduler"]
    environment:
      REDIS_ADDR: redis:6379
      CRON_SCHEDULE: "${CRON_SCHEDULE:-*/1 * * * *}"
      CRON_TASK_TYPE: "demo.sleep"
      CRON_PAYLOAD: '{"duration_ms":100}'
      CRON_PRIORITY: "5"
    depends_on:
      redis:
        condition: service_healthy
  test:
    profiles: ["test"]
    image: golang:1.23-bookworm
    working_dir: /src
    volumes:
      - .:/src
    environment:
      REDIS_TEST_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        go mod download
        test -z "$(gofmt -l $(find . -name '*.go' -type f))"
        go test -mod=readonly -race -tags=integration -count=1 ./...
        go vet -mod=readonly ./...
        go build -mod=readonly ./cmd/api ./cmd/worker ./cmd/healthcheck ./cmd/scheduler
volumes:
  redis_data:
